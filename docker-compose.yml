# Development services. Both are bound to localhost only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grind
      POSTGRES_PASSWORD: grind
      POSTGRES_DB: grind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - grind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grind"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every email the API sends in development. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  grind_pg:
